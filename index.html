<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>[hidden]{display:none!important}body{margin:0}</style>
<title>The A+ Team</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Stencil+One&family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
:root{
  /* Layout: full-bleed 3D scene; HUD pinned to the corners; stencil-cut "crate" cards float over the scene */
  --bg:#121411;
  --panel:#1a1c16;
  --panel-2:#24271f;
  --ink:#efe6d2;
  --muted:#a79e87;
  --red:#e0362a;
  --amber:#f2a33a;
  --good:#8cc46f;
  --bad:#ff7a59;
  --line:rgba(239,230,210,.16);
  --scrim:rgba(10,11,9,.58);
  --display:'Saira Stencil One',Impact,'Arial Narrow',sans-serif;
  --ui:'Barlow Condensed','Arial Narrow',sans-serif;
  --body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);overflow:hidden}
#app{position:fixed;inset:0;overflow:hidden}
#scene{display:block;width:100%;height:100%;touch-action:none}

/* ---------- HUD ---------- */
.hud{position:absolute;inset:0;pointer-events:none;font-family:var(--ui);text-transform:uppercase;letter-spacing:.06em}
.hud-top{position:absolute;top:0;left:0;right:0;display:grid;grid-template-columns:1fr auto 1fr;align-items:start;gap:12px;
  padding-top:calc(env(safe-area-inset-top,0px) + 12px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.chip{background:rgba(26,28,22,.82);border:1px solid var(--line);padding:7px 12px;backdrop-filter:blur(4px)}
.leg-chip{justify-self:start;display:flex;flex-direction:column;gap:4px;min-width:0}
.leg-chip .l1{font-weight:700;font-size:13px;color:var(--amber);letter-spacing:.12em}
.leg-chip .l2{font-weight:600;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dots{display:flex;gap:5px}
.dots i{width:16px;height:5px;background:var(--line)}
.dots i.on{background:var(--good)}
.dots i.next{background:var(--amber)}
.lead{justify-self:center;display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0}
.lead .lab{font-size:12px;font-weight:700;letter-spacing:.16em;color:var(--muted)}
.bar{width:240px;max-width:52vw;height:12px;background:rgba(239,230,210,.12);border:1px solid var(--line);position:relative}
.bar b{position:absolute;inset:0 auto 0 0;background:var(--good);transition:width .25s,background .25s}
.score{justify-self:end;text-align:right;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.score .num{font-size:28px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.score .lab{font-size:12px;color:var(--muted);letter-spacing:.16em;font-weight:700}
.sound{pointer-events:auto;font:600 13px var(--ui);letter-spacing:.1em;text-transform:uppercase;color:var(--ink);background:rgba(26,28,22,.82);border:1px solid var(--line);padding:6px 10px;cursor:pointer}
.hud-bottom{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;
  padding-bottom:calc(env(safe-area-inset-bottom,0px) + 14px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.speed{display:flex;align-items:baseline;gap:6px}
.speed .num{font-size:44px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.speed .u{font-size:14px;color:var(--muted);font-weight:700}
.next{text-align:right;font-size:15px;font-weight:600}
.next small{display:block;font-size:12px;color:var(--muted);letter-spacing:.14em}
.keys{font-size:13px;color:var(--muted);letter-spacing:.08em}
.toast{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 92px);transform:translateX(-50%);max-width:min(560px,calc(100% - 32px));
  background:rgba(26,28,22,.92);border:1px solid var(--amber);padding:9px 16px;font:600 17px var(--ui);letter-spacing:.05em;text-transform:none;text-align:center;
  transition:opacity .3s, transform .3s;pointer-events:none}
.toast.hide{opacity:0;transform:translate(-50%,-8px)}
.toast.bad{border-color:var(--bad)}
.toast.good{border-color:var(--good)}
@media (max-width:640px){
  .hud-top{grid-template-columns:1fr auto}
  .lead{grid-column:1 / -1;order:3;justify-self:stretch;align-items:stretch}
  .bar{width:100%;max-width:none}
  .leg-chip .l2{font-size:15px}
  .speed .num{font-size:34px}
  .keys{display:none}
}

/* ---------- touch controls ---------- */
.touch{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:flex-end;pointer-events:none;
  padding-bottom:calc(env(safe-area-inset-bottom,0px) + 70px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.touch .grp{display:flex;gap:12px}
.touch button{pointer-events:auto;width:66px;height:66px;border-radius:50%;background:rgba(26,28,22,.72);border:1px solid var(--line);color:var(--ink);
  font:700 15px var(--ui);letter-spacing:.06em;text-transform:uppercase;touch-action:none;user-select:none;-webkit-user-select:none}
.touch button.on{background:rgba(242,163,58,.35);border-color:var(--amber)}

/* ---------- cards ---------- */
.overlay{position:absolute;inset:0;display:grid;place-items:center;background:var(--scrim);overflow:auto;
  padding-block:calc(env(safe-area-inset-top,0px) + 16px) calc(env(safe-area-inset-bottom,0px) + 16px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.card{width:min(660px,100%);background:var(--panel);border:1px solid var(--line);display:flex;flex-direction:column;gap:16px;padding:24px 26px 26px;
  clip-path:polygon(18px 0,100% 0,100% calc(100% - 18px),calc(100% - 18px) 100%,0 100%,0 18px);animation:cardIn .28s ease-out}
.card.wide{width:min(760px,100%)}
@keyframes cardIn{from{transform:translateY(10px)}to{transform:none}}
.eyebrow{font:700 13px var(--ui);letter-spacing:.16em;text-transform:uppercase;color:var(--amber)}
.title{font-family:var(--display);font-weight:400;font-size:clamp(52px,11vw,96px);line-height:.9;margin:0;letter-spacing:.01em}
.title .plus{color:var(--red)}
.sub{font:600 clamp(18px,3.4vw,24px) var(--ui);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:-6px}
h2{font-family:var(--display);font-weight:400;font-size:clamp(30px,6vw,46px);line-height:1;margin:0;text-wrap:balance}
p{margin:0;max-width:64ch}
.lede{font-size:16px}
.route{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;counter-reset:leg}
.route li{border:1px solid var(--line);padding:10px 10px 12px;counter-increment:leg;display:flex;flex-direction:column;gap:2px;min-width:0}
.route li::before{content:"Leg " counter(leg);font:700 12px var(--ui);letter-spacing:.14em;text-transform:uppercase;color:var(--amber)}
.route b{font:700 17px var(--ui);text-transform:uppercase;letter-spacing:.04em}
.route span{font-size:13px;color:var(--muted)}
@media (max-width:620px){.route{grid-template-columns:1fr 1fr}}
.controls{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:14px;color:var(--muted)}
kbd{font:600 13px var(--ui);color:var(--ink);border:1px solid var(--line);border-bottom-width:2px;padding:1px 6px;margin-right:2px;background:var(--panel-2)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{font:700 16px var(--ui);letter-spacing:.12em;text-transform:uppercase;border:0;padding:13px 24px;cursor:pointer;color:#fff;background:var(--red);
  clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px)}
.btn:hover{filter:brightness(1.1)}
.btn.ghost{background:var(--panel-2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.btn:disabled{opacity:.45;cursor:default;filter:none}
button:focus-visible{outline:2px solid var(--amber);outline-offset:3px}
.example{border:1px dashed rgba(239,230,210,.3);padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.tag{align-self:flex-start;font:700 12px var(--ui);letter-spacing:.16em;text-transform:uppercase;background:var(--amber);color:#1a1208;padding:2px 8px}
.example ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.example .q{font-weight:600}
.prompt{font-size:18px;line-height:1.45;font-weight:500}
.eq{font-family:var(--ui);font-size:19px;letter-spacing:.03em;background:var(--panel-2);padding:6px 10px;display:inline-block;margin-top:6px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:540px){.opts{grid-template-columns:1fr}}
.opt{display:flex;align-items:center;gap:12px;background:var(--panel-2);border:1px solid var(--line);color:var(--ink);padding:12px 14px;text-align:left;font:500 16px var(--body);cursor:pointer;min-height:58px;min-width:0}
.opt:hover:not(:disabled){border-color:var(--amber)}
.opt .k{font:700 14px var(--ui);width:26px;height:26px;display:grid;place-items:center;border:1px solid var(--line);flex:none;color:var(--muted)}
.opt.wrong{opacity:.5;border-color:var(--bad);text-decoration:line-through;cursor:default}
.opt.right{border-color:var(--good);background:rgba(140,196,111,.13)}
.opt:disabled{cursor:default}
.opt svg{width:66px;height:50px;flex:none}
.mol .b{stroke:var(--muted);stroke-width:2.5}
.mol .bd{stroke:var(--muted);stroke-width:2.5;stroke-dasharray:3 3}
.mol .a{fill:var(--ink)}
.mol .c{fill:var(--red)}
.mol .lp{fill:var(--amber)}
.fb{border:1px solid var(--line);padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.fb.good{border-color:var(--good)}
.fb.bad{border-color:var(--bad)}
.fb.hint{border-color:var(--amber)}
.fb b{font:700 15px var(--ui);letter-spacing:.1em;text-transform:uppercase}
.fb.good b{color:var(--good)}
.fb.bad b{color:var(--bad)}
.fb.hint b{color:var(--amber)}
.meta{display:flex;flex-wrap:wrap;gap:6px 16px;font:600 14px var(--ui);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.meta .pts{color:var(--ink);font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{border:1px solid var(--line);padding:12px;display:flex;flex-direction:column;gap:2px}
.stat .n{font:700 34px var(--ui);line-height:1;font-variant-numeric:tabular-nums}
.stat .l{font:700 12px var(--ui);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
@media (max-width:480px){.stats{grid-template-columns:1fr 1fr}}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line)}
th{font:700 12px var(--ui);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
td.n,th.n{text-align:right}
.tablewrap{overflow-x:auto}
.big{font:700 clamp(54px,12vw,84px) var(--ui);line-height:.9;font-variant-numeric:tabular-nums}
.rank{font-family:var(--display);font-size:28px;color:var(--amber)}
.loading{font:600 15px var(--ui);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.note{font-size:13px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.card{animation:none}.toast,.bar b{transition:none}}
</style>

<div id="app">
  <canvas id="scene" aria-label="3D game view"></canvas>

  <div class="hud" id="hud" hidden>
    <div class="hud-top">
      <div class="chip leg-chip">
        <span class="l1" id="hLeg">Leg 1 of 4</span>
        <span class="l2" id="hLegName">Breakout · Stoichiometry</span>
        <span class="dots" id="hDots"><i></i><i></i><i></i><i></i><i></i></span>
      </div>
      <div class="chip lead">
        <span class="lab" id="hLeadLab">Lead on the pursuers</span>
        <span class="bar"><b id="hLead" style="width:60%"></b></span>
      </div>
      <div class="score">
        <div class="chip"><div class="num" id="hScore">0</div><div class="lab">Score</div></div>
        <button class="sound" id="soundBtn" type="button">Sound on</button>
      </div>
    </div>
    <div class="hud-bottom">
      <div class="chip speed"><span class="num" id="hSpeed">0</span><span class="u">mph</span></div>
      <div class="chip next"><span id="hNext">Checkpoint in 300 m</span><small class="keys" id="hKeys">W A S D or arrows · P to pause</small></div>
    </div>
    <div class="toast hide" id="toast" role="status" aria-live="polite"></div>
  </div>

  <div class="touch" id="touch" hidden>
    <div class="grp"><button type="button" data-k="left" aria-label="Steer left">◀</button><button type="button" data-k="right" aria-label="Steer right">▶</button></div>
    <div class="grp"><button type="button" data-k="down" id="tDown">Brake</button><button type="button" data-k="up" id="tUp">Gas</button></div>
  </div>

  <div class="overlay" id="overlay">
    <div class="card"><div class="loading">Loading the desert…</div></div>
  </div>
</div>

<script type="importmap">

</script>
<script type="module">
import * as THREE from 'three';

/* =====================================================================
   CONTENT: four legs, five checkpoints each (Intro to Chemistry level)
   ===================================================================== */
const LEGS = [
 { name:'Breakout', topic:'Stoichiometry', vehicle:'van', done:'Fuel run complete', next:'Overheat',
   story:'The crew was framed for a payroll heist it never pulled. Tonight you broke out of a desert stockade, and the van is running on fumes. Wrench says the only way to stretch the fuel is to burn it right. Every checkpoint is a fuel calculation.',
   example:{ q:'How many moles of H<sub>2</sub>O form when 2.0 mol of CH<sub>4</sub> burns?', eq:'CH<sub>4</sub> + 2 O<sub>2</sub> → CO<sub>2</sub> + 2 H<sub>2</sub>O',
     steps:['Read the mole ratio from the coefficients: 2 mol H<sub>2</sub>O for every 1 mol CH<sub>4</sub>.','Multiply: 2.0 mol CH<sub>4</sub> × (2 mol H<sub>2</sub>O ÷ 1 mol CH<sub>4</sub>) = <b>4.0 mol H<sub>2</sub>O</b>.'] },
   questions:[
    { q:'Balance the combustion of methane. What coefficient goes in front of O<sub>2</sub>?', eq:'CH<sub>4</sub> + __ O<sub>2</sub> → CO<sub>2</sub> + 2 H<sub>2</sub>O',
      opts:['1','2','3','4'], a:1, hint:'Count the oxygen atoms on the right: CO<sub>2</sub> has 2, and 2 H<sub>2</sub>O has 2 more.',
      why:'The right side has 2 + 2 = 4 O atoms. Each O<sub>2</sub> supplies 2, so you need 2 O<sub>2</sub>.' },
    { q:'How many moles of O<sub>2</sub> are needed to burn 3.0 mol of CH<sub>4</sub>?', eq:'CH<sub>4</sub> + 2 O<sub>2</sub> → CO<sub>2</sub> + 2 H<sub>2</sub>O',
      opts:['1.5 mol','3.0 mol','6.0 mol','9.0 mol'], a:2, hint:'Use the mole ratio: 2 mol O<sub>2</sub> for every 1 mol CH<sub>4</sub>.',
      why:'3.0 mol CH<sub>4</sub> × (2 mol O<sub>2</sub> ÷ 1 mol CH<sub>4</sub>) = 6.0 mol O<sub>2</sub>.' },
    { q:'Wrench has 32.1 g of methane, CH<sub>4</sub> (molar mass 16.04 g/mol). How many moles is that?',
      opts:['0.500 mol','2.00 mol','16.0 mol','515 mol'], a:1, hint:'To go from grams to moles, divide by the molar mass.',
      why:'32.1 g ÷ 16.04 g/mol = 2.00 mol CH<sub>4</sub>. Multiplying instead of dividing gives 515, which is far too large.' },
    { q:'How many grams of CO<sub>2</sub> (44.01 g/mol) form when 16.0 g of CH<sub>4</sub> (16.04 g/mol) burns completely?', eq:'CH<sub>4</sub> + 2 O<sub>2</sub> → CO<sub>2</sub> + 2 H<sub>2</sub>O',
      opts:['16.0 g','22.0 g','43.9 g','87.8 g'], a:2, hint:'Grams CH<sub>4</sub> → moles CH<sub>4</sub> → moles CO<sub>2</sub> (1 : 1) → grams CO<sub>2</sub>.',
      why:'16.0 g ÷ 16.04 g/mol = 0.998 mol CH<sub>4</sub>. The ratio is 1 : 1, so 0.998 mol CO<sub>2</sub> × 44.01 g/mol = 43.9 g CO<sub>2</sub>.' },
    { q:'Limiting reactant: the engine has 2.0 mol of CH<sub>4</sub> but only 3.0 mol of O<sub>2</sub>. Which reactant runs out first?', eq:'CH<sub>4</sub> + 2 O<sub>2</sub> → CO<sub>2</sub> + 2 H<sub>2</sub>O',
      opts:['CH<sub>4</sub>','O<sub>2</sub>','Neither; they run out together','Not enough information'], a:1, hint:'Work out how much O<sub>2</sub> the 2.0 mol of CH<sub>4</sub> would need.',
      why:'2.0 mol CH<sub>4</sub> needs 4.0 mol O<sub>2</sub>, but only 3.0 mol is available. O<sub>2</sub> runs out first, so it is the limiting reactant.' }
   ]},
 { name:'Overheat', topic:'Solutions', vehicle:'van', done:'Engine cooled', next:'Airfield',
   story:'Halfway across the desert, steam pours out from under the hood. The radiator is boiling over and the crew is low on water. Wrench has a jug of coolant concentrate and some salt from the ration kit. Get every mixture right before the engine seizes.',
   example:{ q:'What is the molarity of 0.40 mol of solute in 0.80 L of solution?', eq:'Molarity (M) = moles of solute ÷ liters of solution',
     steps:['Check the units: moles on top, liters of solution on the bottom.','Divide: 0.40 mol ÷ 0.80 L = <b>0.50 M</b>.'] },
   questions:[
    { q:'Wrench dissolves 10 g of sodium chloride (NaCl) in 500 mL of water. Which substance is the solute?',
      opts:['Water','Sodium chloride','The finished solution','Both are solutes'], a:1, hint:'The solute is the substance being dissolved, usually the smaller amount.',
      why:'NaCl is being dissolved, so it is the solute. Water does the dissolving, so it is the solvent.' },
    { q:'0.50 mol of NaCl is dissolved to make 2.0 L of solution. What is the molarity?',
      opts:['0.25 M','1.0 M','2.5 M','4.0 M'], a:0, hint:'M = mol ÷ L.',
      why:'0.50 mol ÷ 2.0 L = 0.25 M.' },
    { q:'29.22 g of NaCl (58.44 g/mol) is dissolved to make 0.500 L of solution. What is the molarity?',
      opts:['0.500 M','1.00 M','2.00 M','58.4 M'], a:1, hint:'Convert grams to moles first, then divide by liters.',
      why:'29.22 g ÷ 58.44 g/mol = 0.5000 mol. Then 0.5000 mol ÷ 0.500 L = 1.00 M.' },
    { q:'The radiator needs 2.0 L of 1.5 M coolant. The jug holds 6.0 M concentrate. How much concentrate should Wrench pour in before topping off with water?', eq:'M<sub>1</sub>V<sub>1</sub> = M<sub>2</sub>V<sub>2</sub>',
      opts:['0.25 L','0.50 L','2.0 L','8.0 L'], a:1, hint:'Put the concentrate on one side and the final mixture on the other, then solve for V<sub>1</sub>.',
      why:'(6.0 M)(V<sub>1</sub>) = (1.5 M)(2.0 L), so V<sub>1</sub> = 3.0 ÷ 6.0 = 0.50 L of concentrate, diluted with water to 2.0 L.' },
    { q:'50.0 g of solute is dissolved in 150.0 g of water. What is the mass percent of the solute?',

   ]},
 { name:'Airfield', topic:'Molecular geometry', vehicle:'van', done:'Ignition panel wired', next:'Escape',
   story:'An old crop-duster airfield sits at the end of the highway, and a utility helicopter is parked on the pad. Ace can hot-wire it, but the ignition panel only accepts the right molecular shapes. Pick up one panel piece at each checkpoint.',
   example:{ q:'What is the shape of methane, CH<sub>4</sub>?', eq:'electron groups on the central atom → shape',
     steps:['Draw the Lewis structure: C makes 4 single bonds to H and has no lone pairs.','Count electron groups on the central atom: 4.','4 groups with 0 lone pairs is <b>tetrahedral</b>, with 109.5° bond angles.'] },
   questions:[
    { q:'In the Lewis structure of water (H<sub>2</sub>O), how many lone pairs sit on the oxygen atom?',
      opts:['0','1','2','3'], a:2, hint:'Oxygen has 6 valence electrons, and 2 of them are used in the O–H bonds.',
      why:'Oxygen has 6 valence electrons. Two go into the O–H bonds, leaving 4 electrons, which is 2 lone pairs.' },
    { q:'What is the molecular shape of H<sub>2</sub>O?', shapes:true,
      opts:['linear','bent','trigonal pyramidal','tetrahedral'], a:1, hint:'O has 4 electron groups, but 2 are lone pairs. The shape describes only where the atoms are.',
      why:'O has 4 electron groups (2 bonds, 2 lone pairs). The lone pairs push the H atoms together into a bent shape, about 104.5°.' },
    { q:'What is the molecular shape of carbon dioxide, O=C=O?', shapes:true,
      opts:['linear','bent','trigonal planar','tetrahedral'], a:0, hint:'Count each double bond as one electron group. Carbon has no lone pairs here.',
      why:'Carbon has 2 electron groups (two double bonds) and no lone pairs, so the atoms line up at 180°: linear.' },
    { q:'What is the molecular shape of ammonia, NH<sub>3</sub>?', shapes:true,
      opts:['trigonal planar','trigonal pyramidal','tetrahedral','bent'], a:1, hint:'Nitrogen makes 3 bonds and keeps 1 lone pair.',

const ROAD_HALF=7;
const ROAD_OFF=22*Math.sin(1.3)+8*Math.sin(0.4);
function roadX(z){return 55*Math.sin(z*0.0021)+22*Math.sin(z*0.0057+1.3)+8*Math.sin(z*0.013+0.4)-ROAD_OFF;}
function roadDir(z){const dx=roadX(z-1)-roadX(z);const l=Math.hypot(dx,1);return {x:dx/l,z:-1/l};}
function roadYaw(z){const d=roadDir(z);return Math.atan2(-d.x,-d.z);}
const canyonT=z=>clamp((-z-5750)/350,0,1);
const APRON={z:-5560}; APRON.x=roadX(APRON.z)+34;
function groundHeight(x,z){
  const dx=Math.abs(x-roadX(z));
  let h=(fbm(x*0.005+3.1,z*0.005-1.7)-0.42)*46+(fbm(x*0.03,z*0.03)-0.5)*5;
  h*=smooth(ROAD_HALF+5,ROAD_HALF+48,dx);
  const ct=canyonT(z);
  if(ct>0){const wall=smooth(78,130,dx)*(55+fbm(x*0.02,z*0.02)*60);h=h*(1-ct*0.6)+wall*ct;}
  h*=smooth(42,75,Math.hypot(x-APRON.x,(z-APRON.z)*0.8));
  return h;
}

function buildTerrain(){
  const TW=1000, TL=TZ0-TZ1, segZ=Math.round(TL/10);
  const geo=new THREE.PlaneGeometry(TW,TL,100,segZ); geo.rotateX(-Math.PI/2); geo.translate(0,0,(TZ0+TZ1)/2);
  const p=geo.attributes.position, cols=new Float32Array(p.count*3);
  const cSand=new THREE.Color(0xd8b386),cClay=new THREE.Color(0xc4895a),cScrub=new THREE.Color(0x9b8c5f),cRock=new THREE.Color(0xa65a3a),cShoulder=new THREE.Color(0x9a8569),col=new THREE.Color();
  for(let i=0;i<p.count;i++){
    const x=p.getX(i), z=p.getZ(i), h=groundHeight(x,z); p.setY(i,h);
    const dx=Math.abs(x-roadX(z));
    col.copy(cSand).lerp(cClay,smooth(0.35,0.75,fbm(x*0.018+11,z*0.018-4)));
    col.lerp(cScrub,smooth(0.55,0.8,fbm(x*0.05,z*0.05))*0.5);
    if(h>5) col.lerp(cRock,smooth(5,28,h));
    col.lerp(cShoulder,1-smooth(ROAD_HALF+1,ROAD_HALF+6,dx));
    cols[i*3]=col.r;cols[i*3+1]=col.g;cols[i*3+2]=col.b;
  }
  geo.setAttribute('color',new THREE.BufferAttribute(cols,3)); geo.computeVertexNormals();
  const m=new THREE.Mesh(geo,new THREE.MeshStandardMaterial({vertexColors:true,map:grainTex,roughness:1,metalness:0}));
  m.receiveShadow=true; scene.add(m);
}
function buildRoad(){
  const pos=[],uv=[],nor=[],idx=[]; let dist=0,prev=null,i=0;
  for(let z=TZ0-30; z>=TZ1+30; z-=4){
    const cx=roadX(z), d=roadDir(z), rx=-d.z, rz=d.x;
    if(prev) dist+=Math.hypot(cx-prev.x,z-prev.z); prev={x:cx,z};
    pos.push(cx-rx*ROAD_HALF,0.1,z-rz*ROAD_HALF, cx+rx*ROAD_HALF,0.1,z+rz*ROAD_HALF);
    uv.push(0,dist/14,1,dist/14); nor.push(0,1,0,0,1,0);
    if(i>0){const a=(i-1)*2,b=a+1,c=a+2,e=a+3; idx.push(a,b,c,b,e,c);} i++;
  }
  const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2)); g.setAttribute('normal',new THREE.Float32BufferAttribute(nor,3)); g.setIndex(idx);
  const m=new THREE.Mesh(g,new THREE.MeshStandardMaterial({map:roadTex,roughness:0.92,metalness:0,polygonOffset:true,polygonOffsetFactor:-2,polygonOffsetUnits:-2}));
  m.receiveShadow=true; scene.add(m);
}

function extrudeProfile(points,arcs,width,mat){
  const s=new THREE.Shape(); s.moveTo(points[0][0],points[0][1]);
  for(let i=1;i<points.length;i++) s.lineTo(points[i][0],points[i][1]);
  for(const a of arcs){ s.lineTo(a[0]-a[2],a[3]); s.absarc(a[0],a[3],a[2],Math.PI,0,true); }
  s.lineTo(points[0][0],points[0][1]);
  const g=new THREE.ExtrudeGeometry(s,{depth:width,bevelEnabled:true,bevelThickness:0.05,bevelSize:0.05,bevelSegments:2,curveSegments:10});
  g.rotateY(Math.PI/2); g.translate(-width/2,0,0);

}

// two-tone paint with the red stripe that sweeps up toward the back (drawn in object space so the line stays crisp)
function vanPaint(){
  const m=new THREE.MeshStandardMaterial({color:0x56595e,metalness:0.6,roughness:0.34});
  m.onBeforeCompile=sh=>{
    sh.vertexShader=sh.vertexShader.replace('#include <common>','#include <common>\nvarying vec3 vObjPos;\nvarying vec3 vObjN;')
      .replace('#include <begin_vertex>','#include <begin_vertex>\nvObjPos=position;\nvObjN=normal;');
    sh.fragmentShader=sh.fragmentShader.replace('#include <common>','#include <common>\nvarying vec3 vObjPos;\nvarying vec3 vObjN;')
      .replace('#include <color_fragment>',`#include <color_fragment>
        vec3 on=normalize(vObjN);
        float sideF=smoothstep(0.35,0.6,abs(on.x));
        float rearF=smoothstep(0.45,0.7,on.z)*step(2.3,vObjPos.z);
        float kick=clamp(vObjPos.z-1.0,0.0,1.6);
        float cy=mix(0.88+kick*0.4,1.5,rearF);
        float d=abs(vObjPos.y-cy);
        float band=(1.0-smoothstep(0.07,0.085,d))*max(sideF,rearF)*step(-2.45,vObjPos.z)*step(0.4,vObjPos.y);
        float lower=1.0-smoothstep(cy-0.01,cy+0.01,vObjPos.y);
        diffuseColor.rgb=mix(diffuseColor.rgb,vec3(0.010,0.010,0.012),lower);
        diffuseColor.rgb=mix(diffuseColor.rgb,vec3(0.50,0.015,0.012),band);`);
  };
  return m;
}

function playTheme(){
  if(!S.soundOn) return; initAudio(); stopTheme();
  if(actx){ if(actx.state==='suspended') actx.resume();
    const go=buf=>{ if(!S.soundOn) return; stopTheme(); themeGain=actx.createGain(); themeGain.gain.value=0.85;
      themeSrc=actx.createBufferSource(); themeSrc.buffer=buf; themeSrc.connect(themeGain).connect(actx.destination); themeSrc.start(); };
    if(themeBuf){ go(themeBuf); return; }
    if(themeArr){ actx.decodeAudioData(themeArr.slice(0)).then(b=>{themeBuf=b; go(b);}).catch(playElement); return; }
  }

}
function fadeTheme(sec){

    setTimeout(()=>{ try{src.stop();}catch(e){} if(themeSrc===src) themeSrc=null; },sec*1000+50); return; }
  if(music.paused) return; const v0=music.volume,t0=performance.now();
  const f=()=>{const t=(performance.now()-t0)/(sec*1000); if(t>=1){music.pause();music.volume=0.85;return;} music.volume=v0*(1-t); musicFade=requestAnimationFrame(f);}; f(); }

function shapeSVG(name){

  A.forEach((p,i)=>{s+=`<line class="${name==='tetrahedral'&&i===3?'bd':'b'}" x1="40" y1="30" x2="${p[0]}" y2="${p[1]}"/>`;});
  LP.forEach(p=>{s+=`<circle class="lp" cx="${p[0]-3.5}" cy="${p[1]}" r="2.6"/><circle class="lp" cx="${p[0]+3.5}" cy="${p[1]}" r="2.6"/>`;});
  A.forEach(p=>{s+=`<circle class="a" cx="${p[0]}" cy="${p[1]}" r="6"/>`;});

function onRoadAt(x,z){ return Math.abs(x-roadX(z))<ROAD_HALF+0.6; }

function updateVan(dt){
  const up=inp('up'),dn=inp('down'),lf=inp('left'),rt=inp('right');
  const onR=onRoadAt(van.x,van.z), maxF=onR?44:22;
  if(up) van.speed+=(van.speed<0?40:21)*dt;

  if(van.speed>maxF) van.speed=Math.max(maxF,van.speed-30*dt);
  van.speed=clamp(van.speed,-9,60);
  van.steer+=(((lf?1:0)-(rt?1:0))-van.steer)*damp(7,dt);
  const sf=clamp(Math.abs(van.speed)/9,0,1)*(1-0.45*clamp(Math.abs(van.speed)/44,0,1));

  const fx=-Math.sin(van.yaw),fz=-Math.cos(van.yaw),rx=-fz,rz=fx;

  // obstacles
  for(const o of obstacles){ if(o.hit) continue; const dx=o.g.position.x-van.x,dz=o.g.position.z-van.z;
    if(Math.abs(dz)<4&&Math.hypot(dx,dz)<o.rad+1.2){ o.hit=true; o.fly=1.6; const side=Math.sign(dx)||1;
      o.vel.set(side*5+fx*van.speed*0.5,7+Math.abs(van.speed)*0.12,fz*van.speed*0.5); o.spin.set(Math.random()*6,Math.random()*6,Math.random()*6);

function checkCaught(){

}
function updatePursuers(dt){

function prepareHeli(resume){

function updateLift(dt){

function updateHeli(dt){

    if(Math.hypot(s.x-x,s.z-heli.z)<s.rad+2.4&&heli.y<s.top&&heli.hitCD<=0){ heli.hitCD=1.5; S.lead=Math.max(0,S.lead-8); S.shake=reduceMotion?0:0.7;

function updateChaseHeli(dt){

function placeAt(leg,cp){

const camPos=new THREE.Vector3(), camLook=new THREE.Vector3(); let camInit=false;
function updateCamera(dt){
  let pos=new THREE.Vector3(), look=new THREE.Vector3(), rate=5;
  const heliPhase = S.leg===3 && (S.mode==='heli'||S.mode==='lift'||S.mode==='question'||S.mode==='paused'||S.mode==='final'||(S.mode==='brief'));
  if(S.mode==='title'||S.mode==='boot'){
    const a=T*0.12; pos.set(van.x+Math.sin(a)*11,3.2,van.z+Math.cos(a)*11); look.set(van.x,1.2,van.z); rate=3;
  } else if(heliPhase){
    const hp=playerHeli.group.position, yaw=roadYaw(heli.z);
    if(S.mode==='final'){ const a=T*0.15; pos.set(hp.x+Math.sin(a)*24,hp.y+6,hp.z+Math.cos(a)*24); look.copy(hp); }
    else if(heli.lift<1&&S.mode!=='heli'){ const a=0.9-heli.lift*0.9; pos.set(hp.x+Math.sin(yaw+a)*18,hp.y+4+heli.lift*3,hp.z+Math.cos(yaw+a)*18); look.set(hp.x,hp.y+1.5,hp.z); }
    else { pos.set(hp.x+Math.sin(yaw)*21,hp.y+7,hp.z+Math.cos(yaw)*21); look.set(hp.x-Math.sin(yaw)*22,hp.y-0.5,hp.z-Math.cos(yaw)*22); }
  } else {
    const yaw=van.yaw, bx=Math.sin(yaw),bz=Math.cos(yaw);
    pos.set(van.x+bx*10.5,van.y+4.1,van.z+bz*10.5); look.set(van.x-bx*7,van.y+1.4,van.z-bz*7);
    if(S.mode==='brief'&&S.cp===0){ pos.set(van.x+bx*9-bz*5,van.y+3,van.z+bz*9+bx*5); }
    pos.y=Math.max(pos.y,groundHeight(pos.x,pos.z)+1.5);
  }
  if(!camInit){camPos.copy(pos);camLook.copy(look);camInit=true;}
  camPos.lerp(pos,damp(rate,dt)); camLook.lerp(look,damp(rate*1.4,dt));
  camera.position.copy(camPos);
  if(S.shake>0){ camera.position.x+=(Math.random()-0.5)*S.shake; camera.position.y+=(Math.random()-0.5)*S.shake; S.shake=Math.max(0,S.shake-dt*1.5); }
  camera.lookAt(camLook);
  const targetFov=62+(S.mode==='drive'?clamp(van.speed/44,0,1)*8:0);
  if(Math.abs(camera.fov-targetFov)>0.05){camera.fov=lerp(camera.fov,targetFov,damp(3,dt));camera.updateProjectionMatrix();}
  sky.position.copy(camera.position);
  const focus = heliPhase?playerHeli.group.position:new THREE.Vector3(van.x,van.y,van.z);
  sun.target.position.copy(focus); sun.position.copy(focus).addScaledVector(SUN_DIR,150);
}
function updateVanVisual(){
  const m=van.model; if(!m) return;

  playerHeli.rotor.rotation.y+=rs*dt; playerHeli.tail.rotation.x+=rs*1.6*dt;
  playerHeli.beacon.material.emissiveIntensity=(T%1<0.15)?3:0.2;
  if(chaseHeli.group.visible){ chaseHeli.rotor.rotation.y+=30*dt; chaseHeli.tail.rotation.x+=48*dt; chaseHeli.beacon.material.emissiveIntensity=(T%0.8<0.12)?3:0.2; }
  rings.forEach((r,i)=>{ r.m.rotation.z+=dt*(i===S.cp&&S.leg===3?0.8:0.2); });
  if(toastT>0){ toastT-=dt; if(toastT<=0) $('toast').classList.add('hide'); }
}
let hudCache={};
function setText(id,v){ if(hudCache[id]!==v){ hudCache[id]=v; $(id).textContent=v; } }
function updateHUD(){
  if($('hud').hidden) return;
  setText('hScore',String(S.score));
  const L=LEGS[S.leg], lead=clamp(S.lead,0,100), bar=$('hLead');
  bar.style.width=lead.toFixed(1)+'%'; bar.style.background=lead>50?'var(--good)':lead>25?'var(--amber)':'var(--bad)';
  if(L.vehicle==='van'){ setText('hSpeed',String(Math.round(Math.abs(van.speed)*2.237))); setText('hNext',S.cp<5?`Checkpoint ${S.cp+1} in ${Math.max(0,Math.round(van.z-cpZ(S.leg,S.cp)))} m`:'Leg complete'); }
  else { setText('hSpeed',String(Math.round(34*2.237))); setText('hNext',S.cp<5?`Ring ${S.cp+1} in ${Math.max(0,Math.round(heli.z-cpZ(3,S.cp)))} m`:'Clear!'); }
}
const clock=new THREE.Clock();
function frame(){
  const dt=Math.min(clock.getDelta(),0.05); T+=dt;
  if(S.mode==='drive') updateVan(dt); else if(S.mode==='lift') updateLift(dt); else if(S.mode==='heli') updateHeli(dt);
  else if(S.mode!=='question'&&S.mode!=='paused') setEngine(40,0);
  updatePursuers(dt); updateChaseHeli(dt); updateVanVisual(); animate(dt); updateCamera(dt); updateHUD();
  renderer.render(scene,camera); requestAnimationFrame(frame);
}
function resize(){ const w=innerWidth,h=innerHeight; renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix(); }
addEventListener('resize',resize);

/* =====================================================================
   BOOT
   ===================================================================== */
async function loadVan(){
  try{
    const res=await fetch('van.json'); const b64=(await res.json()).glb;
    const bin=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
    const gltf=await new GLTFLoader().parseAsync(bin.buffer,'');
    const root=new THREE.Group(); root.rotation.order='YXZ'; root.add(gltf.scene);
    const paint=vanPaint(), rimRed=new THREE.MeshStandardMaterial({color:0xb3121b,metalness:0.55,roughness:0.32});
    const wheels=[], front=[];
    gltf.scene.traverse(o=>{
      if(o.isMesh){ o.castShadow=true; o.receiveShadow=true; const n=o.material.name||'';
        if(n==='paint') o.material=paint; else if(n==='rim') o.material=rimRed; else if(n==='glass') o.material=glassMat;
        else if(n==='headlight'){ o.material.emissiveIntensity=1.6; } }
      const m=/^w(F|R)(L|R)_/.exec(o.name||'');
      if(m){ o.rotation.order='YXZ'; wheels.push(o); if(m[1]==='F') front.push(o); }
    });
    scene.remove(van.model.group); scene.add(root);
    van.model={group:root,wheels,front};
  }catch(e){ console.warn('Van model failed to load; keeping the stand-in.',e); }
}
async function start(data){
  try{ await Promise.race([document.fonts.ready,new Promise(r=>setTimeout(r,1500))]); }catch(e){}
  resize(); buildTerrain(); buildRoad(); buildScenery(); buildAirfield(); buildGates(); buildObstacles(); buildRings(); buildSpires();
  const stand=makeStandInVan(); scene.add(stand.group); van.model={group:stand.group,wheels:stand.wheels,front:stand.front};
  for(let i=0;i<2;i++){ const p=makeSUV(); scene.add(p.group); pursuers.push(p); }
  playerHeli=makeHeli(0x5b6140,false); scene.add(playerHeli.group);
  chaseHeli=makeHeli(0x121416,true); chaseHeli.group.visible=false; scene.add(chaseHeli.group);
  heli.z=APRON.z; heli.u=APRON.x-roadX(APRON.z); heli.y=0.12; placeHeli(0);
  setSound(S.soundOn);
  loadVan();
  requestAnimationFrame(frame);
  if(data&&typeof data.leg==='number'&&data.mode&&data.mode!=='title'&&data.mode!=='boot'){
    Object.assign(S,{leg:data.leg,cp:data.cp||0,score:data.score||0,lead:data.lead??60,legStats:data.legStats||S.legStats});
    placeAt(S.leg,S.cp); refreshHudLeg(); showBriefing(S.leg);
  } else showTitle();
}
window.claude?.hot?.snapshot?.(()=>({mode:S.mode,leg:S.leg,cp:S.cp,score:S.score,lead:S.lead,legStats:S.legStats}));
window.__aplus={audio:()=>({ctx:actx&&actx.state,src:!!themeSrc,el:!music.paused}),S,van,heli,roadX,openQuestion,showBriefing,placeAt,prepareHeli,cpZ,LEGS,setMode:m=>S.mode=m};
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
